<style>
:root{--crema:#F4EFE6;--papel:#FBF9F4;--ladrillo:#C8572A;--vino:#9B3A2E;
      --tinta:#1D1D1B;--linea:#E7DCC9;--mute:#6B6256}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);
     font-family:Manrope,-apple-system,"Segoe UI",sans-serif;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.reja{width:100%;max-width:392px;text-align:center}
.marca{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:26px;
       letter-spacing:.30em;color:var(--ladrillo)}
.marca span{display:block;font-family:Manrope,sans-serif;font-size:9.5px;font-weight:700;
            letter-spacing:.20em;color:var(--mute);margin-top:6px;text-transform:uppercase}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:31px;
   margin:36px 0 6px;letter-spacing:-.01em}
p.sub{color:var(--mute);font-size:15px;margin:0 0 26px}
form{display:flex;flex-direction:column;gap:10px}
input{font-family:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--linea);
      border-radius:8px;background:var(--papel);color:var(--tinta);text-align:center;
      letter-spacing:.16em;text-transform:uppercase}
input:focus{outline:2px solid var(--ladrillo);outline-offset:1px;border-color:transparent}
button{font-family:inherit;font-size:15px;font-weight:700;padding:14px 16px;border:0;
       border-radius:8px;background:var(--ladrillo);color:#fff;cursor:pointer}
button:hover{background:var(--vino)}
button:disabled{opacity:.55;cursor:default}
.error{color:var(--vino);font-size:14px;font-weight:600;min-height:20px;margin:4px 0 0}
.pie{margin-top:30px;font-size:12.5px;color:var(--mute);line-height:1.55}
@media (prefers-color-scheme:dark){
  body{background:#171614;color:#F1EBE1}
  input{background:#201E1B;border-color:#38332C;color:#F1EBE1}
  .marca{color:#E4794A} button{background:#E4794A}
}
</style>

  <h1>Jofré 157</h1>
  <p class="sub">Esta propuesta es privada. Escribe la clave que te enviamos.</p>
  <form id="f" autocomplete="off">

  </form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrir(clave){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b(CARGA.s), iterations:CARGA.it, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(CARGA.n)}, k, b(CARGA.c));
  return new TextDecoder().decode(claro);
}

const f = document.getElementById('f'), e = document.getElementById('e'), btn = document.getElementById('b');
f.addEventListener('submit', async ev => {
  ev.preventDefault();
  e.textContent = ''; btn.disabled = true; btn.textContent = 'Abriendo...';
  try{
    const html = await abrir(document.getElementById('c').value.trim().toUpperCase());
    document.open(); document.write(html); document.close();
    try{ sessionStorage.setItem('jofre', document.getElementById('c') ? '' : ''); }catch(_){}
  }catch(_){
    e.textContent = 'Esa clave no es.';
    btn.disabled = false; btn.textContent = 'Entrar';
    document.getElementById('c').select();
  }
});
document.getElementById('c').focus();
</script>
